<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title>Document</title>
</head>
<body>
    <main>

         <h1>Praticando java Script </Script></h1>

        <section>
            <h2>Troca um nome na tela</h2>
            <input type="text" id="nome-entrada" placeholder="Informe o seu nome">
            <button id="btn-troca">Troca nome</button>
            <p>Olá <b id="nome-saida">Visitante</b>!</p>
        </section>
        <section>
            <h2>Alterando a cor da caixa</h2>
            <div id="caixa">Aqui a caixa </div>
            <button id="btn_azul" class="btn">AZUL</button>
            <button id="btn_verde" class="btn">VERDE</button>
            <button id="btn_amarelo" class="btn">AMARELO</button>
        </section>
   
     <h2> Simulando adção de valores</h2>
    <section class="area_add_sub">
        <button id="btn_menos"> - </button>
        <p id="valor_real"> 0 </p>
        <button id="btn_mais"> + </button>
    </section>
    <h2>Adicionando Livros </h2>
    <section class="area-livros">

        <input type="text" id="nome_livro">
        <button id="adiciona_livro">Adicionar</button>

        <ul id="lista_livros">
        </ul>
        <button id="remover_livro">Remover</button>
    </section>
     </main>
    <script src="home.js"></script>

    
</body>
</html>
